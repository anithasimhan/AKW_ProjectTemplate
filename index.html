<title>Warm Homes, Chennai Families — Mood Board Inspiration Book</title>

<style>
:root{
  --warm-white:#FAF6EF; --beige:#E6D9C3; --oak:#B58853; --sage:#97AB84; --terracotta:#C0623B; --charcoal:#34322E;
  --ink:#34322E; --muted:#6F6A60; --line:#E3D8C5;
  --serif:'Fraunces',Georgia,serif; --sans:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--warm-white);color:var(--ink);line-height:1.6;font-size:16px}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--terracotta);outline-offset:3px}

/* layout: sticky side index + content */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav.index{position:sticky;top:0;height:100vh;overflow:auto;padding:32px 24px;border-right:1px solid var(--line);background:var(--warm-white)}
nav.index .brand{font-family:var(--serif);font-size:20px;line-height:1.25;margin-bottom:24px}
nav.index ol{list-style:none}
nav.index a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font-size:14px;border-left:2px solid transparent;padding-left:12px;margin-left:-12px}
nav.index a:hover,nav.index a.on{color:var(--charcoal);border-left-color:var(--terracotta)}
main{min-width:0}

/* cover */
.cover{position:relative;min-height:92vh;display:flex;align-items:flex-end;color:#fff;background:#6b5a46}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(30,26,20,.82) 0%,rgba(30,26,20,.35) 55%,rgba(30,26,20,.1) 100%)}
.cover .txt{position:relative;z-index:2;padding:64px clamp(24px,5vw,72px);max-width:880px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6.5vw,88px);line-height:1.02;letter-spacing:-.02em}
.cover p.vision{margin-top:24px;font-size:clamp(17px,1.6vw,21px);max-width:640px;color:#f3eadb}
.cover .meta{margin-top:28px;font-size:14px;color:#e0d3bd}
.cover .strip{position:relative;z-index:2;display:flex;gap:10px;padding:0 clamp(24px,5vw,72px) 40px}
.cover .strip span{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}

section{padding:88px clamp(24px,5vw,72px) 24px;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
.sec-head{max-width:760px;margin-bottom:40px}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,52px);line-height:1.1;letter-spacing:-.015em}
.sec-head p{margin-top:14px;color:var(--muted);font-size:17px}

.group{margin-bottom:56px}
.group h3{font-family:var(--serif);font-weight:600;font-size:22px;margin-bottom:4px}
.group .note{color:var(--muted);font-size:15px;max-width:720px;margin-bottom:18px}

/* Pinterest masonry */
.masonry{columns:4 220px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:14px;border-radius:10px;overflow:hidden;background:var(--beige);cursor:zoom-in;position:relative;border:0;display:block;width:100%;padding:0}
.tile img{width:100%;height:auto;transition:transform .5s ease;background:var(--beige);min-height:120px}
.tile:hover img{transform:scale(1.04)}
.tile.r1 img{aspect-ratio:3/4;object-fit:cover}
.tile.r2 img{aspect-ratio:4/5;object-fit:cover}
.tile.r3 img{aspect-ratio:1/1;object-fit:cover}
.tile.r4 img{aspect-ratio:4/3;object-fit:cover}
.tile.r5 img{aspect-ratio:2/3;object-fit:cover}

/* text cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:56px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px}
.card h4{font-family:var(--serif);font-weight:600;font-size:19px;margin-bottom:8px}
.card p,.card li{font-size:15px;color:#524e46}
.card ul{padding-left:18px}
.card.dark{background:var(--charcoal);border-color:var(--charcoal)}
.card.dark h4{color:#fff}.card.dark p,.card.dark li{color:#ddd3c1}

/* palette */
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sw{padding:80px 16px 16px;font-size:14px}
.sw b{display:block;font-family:var(--serif);font-size:18px;font-weight:600}

/* kw */
.kw-intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:56px}

.cta{margin:72px clamp(24px,5vw,72px) 0;padding:48px 0 72px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;max-width:820px}
.cta h2{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);margin-bottom:10px}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(24,21,17,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#lb.open{display:flex}
#lb img{max-height:90vh;max-width:92vw;border-radius:6px;object-fit:contain}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.3)}
#lb .x{top:20px;right:20px}#lb .p{left:20px;top:50%}#lb .n{right:20px;top:50%}

#mobtop{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.index{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:20px 24px}
  nav.index ol{display:flex;gap:6px 16px;flex-wrap:wrap}
  nav.index a{border-left:0;margin:0;padding:2px 0}
  section{padding-top:64px}
  .masonry{columns:2 150px;column-gap:10px}
  .tile{margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile img{transition:none}}
@media print{nav.index,#lb{display:none}.shell{display:block}.tile{cursor:default}section{break-before:page}}
</style>
</head>

/* ---------- RENDER ---------- */
const used = {};
const ratios = ['r1','r4','r2','r3','r5','r4','r1','r3'];
let rIdx = 0;
const lbList = [];

function pick(pool,start,n,sec){
  const arr = POOL[pool]; const out=[]; const u = used[sec] = used[sec] || new Set();
  for(let i=0;i<arr.length && out.length<n;i++){
    const id = arr[(start+i)%arr.length];
    if(!u.has(id)){u.add(id);out.push(id);}
  }
  return out;
}

function tiles(ids,alt){
  return ids.map(id=>{
    const r = ratios[(rIdx++)%ratios.length];
    return `<button class="tile ${r}" data-full="${UL(id)}" aria-label="Open image: ${alt}"><img loading="lazy" decoding="async" src="${U(id)}" alt="${alt}"></button>`;
  }).join('');
}

SECTIONS.forEach(S=>{
  let h = `<section id="${S.id}"><div class="sec-head"><h2>${S.title}</h2><p>${S.intro}</p></div>`;

  if(S.kw) h += `<div class="kw-intro">${S.kw.map((c,i)=>`<div class="card ${i%3==2?'dark':''}"><h4>${c.h}</h4><p>${c.p}</p></div>`).join('')}</div>`;
  if(S.swatches) h += `<div class="swatches">${S.swatches.map(s=>`<div class="sw" style="background:${s.c};color:${s.dark?'#34322E':'#fff'}"><b>${s.n}</b>${s.c}<br><span>${s.u}</span></div>`).join('')}</div>`;

  });

});

/* ---------- Broken image handling: remove tile so grid stays clean ---------- */
document.querySelectorAll('.tile img').forEach(img=>{
  img.addEventListener('error',()=>{
    const t=img.closest('.tile'); if(t) t.remove();
    refreshLB();
  },{once:true});
});
document.querySelectorAll('.cover>img').forEach(img=>img.addEventListener('error',()=>{
  img.style.display='none';
  document.querySelector('.cover').style.background='linear-gradient(135deg,#8a6a45,#34322E)';
}));

/* ---------- Lightbox ---------- */
const lb=document.getElementById('lb'), lbImg=lb.querySelector('img');
let cur=0, items=[];
function refreshLB(){ items=[...document.querySelectorAll('.tile')]; }
refreshLB();
function show(i){cur=(i+items.length)%items.length;lbImg.src=items[cur].dataset.full;lbImg.alt=items[cur].querySelector('img').alt;}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tile');
  if(t){refreshLB();show(items.indexOf(t));lb.classList.add('open');lb.querySelector('.x').focus();}
});
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.p').onclick=()=>show(cur-1);
lb.querySelector('.n').onclick=()=>show(cur+1);
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open')});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowLeft')show(cur-1);
  if(e.key==='ArrowRight')show(cur+1);
});

/* ---------- Nav highlight ---------- */
const links=[...document.querySelectorAll('nav.index a')];
const io=new IntersectionObserver(es=>{
  es.forEach(en=>{ if(en.isIntersecting){ links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+en.target.id)); }});
},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('header.cover,section').forEach(s=>io.observe(s));
</script>
